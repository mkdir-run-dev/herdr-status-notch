name: HerdrStatusNotch
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  HerdrStatusNotch:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.herdr.statusnotch
        PRODUCT_NAME: HerdrStatusNotch
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # 런치패드·아이콘 노출을 위해 plist는 일반 앱으로 둔다. Dock 숨김은
        # 런타임에 AppDelegate가 accessory로 전환한다.
        INFOPLIST_KEY_LSUIElement: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        # 로컬 빌드 전용이라 ad-hoc 서명으로 충분하다.
        CODE_SIGN_IDENTITY: "-"
schemes:
  HerdrStatusNotch:
    build:
      targets:
        HerdrStatusNotch: all
    run:
      config: Debug
    archive:
      config: Release
